# Publish-only workflow — proves GHCR immutable tags without deploying.
# Use before Tailscale/SSH secrets exist, or to rebuild a SHA.
name: Publish image

on:
  workflow_dispatch:
  push:
    branches: [feat/continuous-delivery]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/quintendesaever/clippy

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          SHA="$(echo -n "${GITHUB_SHA}" | tr '[:upper:]' '[:lower:]')"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}:${SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE_NAME }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/quintendesaever/Clippy
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Echo image
        run: echo "Published ${{ steps.meta.outputs.image }}"
