# Continuous Delivery — runs only after CI succeeds on main (or manual dispatch).
# Does not replace CI. No self-hosted runners. No public SSH.
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_production:
        description: "Stop after staging (no production deploy)"
        type: boolean
        default: true

concurrency:
  group: clippy-cd-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read

env:
  IMAGE_NAME: ghcr.io/quintendesaever/clippy
  DEPLOY_HOST: ai-server
  # INTERIM (accepted for first cutover): personal account + forced-command CD key.
  # Blast radius: docker-group equivalent via this key only (cd-apply/deploy allowlist).
  # Switch DEPLOY_USER to deploy-clippy after: sudo bash deploy/setup-deploy-user.sh --apply
  # and move the forced-command pubkey to that account. Do not enable production
  # Environment deploys until that switch is done OR this interim is explicitly re-accepted.
  DEPLOY_USER: quinten

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      image: ${{ steps.ref.outputs.image }}
    steps:
      - name: Resolve commit SHA
        id: ref
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            RAW="${{ github.event.workflow_run.head_sha }}"
            echo "Triggered by CI run ${{ github.event.workflow_run.id }} conclusion=${{ github.event.workflow_run.conclusion }}"
          else
            RAW="${{ github.sha }}"
            echo "Manual workflow_dispatch"
          fi
          SHA="$(echo -n "${RAW}" | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid sha: $SHA"; exit 1; }
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}:${SHA}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: ci-gate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ needs.ci-gate.outputs.image }}
      sha: ${{ needs.ci-gate.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.ci-gate.outputs.sha }}
            ${{ env.IMAGE_NAME }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/quintendesaever/Clippy
            org.opencontainers.image.revision=${{ needs.ci-gate.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: [ci-gate, build-and-push]
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: clippy-deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout deploy sources
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}

      - name: Select deploy transport
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${DEPLOY_SSH_KEY}" ]] || { echo "Missing secret DEPLOY_SSH_KEY"; exit 1; }
          if [[ -n "${TS_OAUTH_CLIENT_ID}" && -n "${TS_OAUTH_SECRET}" ]]; then
            echo "TS_MODE=oauth" >> "$GITHUB_ENV"
          elif [[ -n "${TAILSCALE_AUTHKEY}" ]]; then
            echo "TS_MODE=authkey" >> "$GITHUB_ENV"
          else
            echo "TS_MODE=host_agent" >> "$GITHUB_ENV"
            echo "No Tailscale secrets; using cd-host-agent handoff on ai-server"
          fi
      - name: Connect Tailscale (OAuth)
        if: env.TS_MODE == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Connect Tailscale (auth key)
        if: env.TS_MODE == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Sync deploy artifacts + deploy staging
        if: env.TS_MODE == 'oauth' || env.TS_MODE == 'authkey'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "${RUNNER_TEMP}/deploy_key"
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${RUNNER_TEMP}/deploy_key"
          tar -C deploy -czf "${RUNNER_TEMP}/clippy-cd.tgz" \
            deploy.sh cd-apply.sh ssh-forced-command.sh cutover-production.sh \
            compose known_hosts
          # stdin tar → cd-apply.sh syncs host files from this commit, then deploys
          ssh -i "${RUNNER_TEMP}/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${GITHUB_WORKSPACE}/deploy/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "/data/deployments/clippy/bin/cd-apply.sh staging '${IMAGE}'" \
            < "${RUNNER_TEMP}/clippy-cd.tgz"
      - name: Host-agent deploy handoff
        if: env.TS_MODE == 'host_agent'
        env:
          SHA: ${{ needs.ci-gate.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CTX="cd-host/clippy/staging"
          gh api -X POST "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state=pending \
            -f context="$CTX" \
            -f description="deploy:${SHA}"
          echo "Waiting for ai-server cd-host-agent ($CTX)…"
          for i in $(seq 1 90); do
            STATE="$(gh api "repos/${{ github.repository }}/commits/${SHA}/statuses" \
              | jq -r --arg c "$CTX" '[.[]|select(.context==$c)][0].state // empty')"
            echo "poll $i state=${STATE:-none}"
            case "${STATE}" in
              success) exit 0 ;;
              failure|error) exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for host agent"
          exit 1

  deploy-production:
    needs: [ci-gate, build-and-push, deploy-staging]
    # Production only via attended workflow_dispatch (skip_production=false); staging always on main.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_production != true }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: clippy-deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout deploy sources
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}

      - name: Select deploy transport
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${DEPLOY_SSH_KEY}" ]] || { echo "Missing secret DEPLOY_SSH_KEY"; exit 1; }
          if [[ -n "${TS_OAUTH_CLIENT_ID}" && -n "${TS_OAUTH_SECRET}" ]]; then
            echo "TS_MODE=oauth" >> "$GITHUB_ENV"
          elif [[ -n "${TAILSCALE_AUTHKEY}" ]]; then
            echo "TS_MODE=authkey" >> "$GITHUB_ENV"
          else
            echo "TS_MODE=host_agent" >> "$GITHUB_ENV"
            echo "No Tailscale secrets; using cd-host-agent handoff on ai-server"
          fi
      - name: Connect Tailscale (OAuth)
        if: env.TS_MODE == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Connect Tailscale (auth key)
        if: env.TS_MODE == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Sync deploy artifacts + deploy production
        if: env.TS_MODE == 'oauth' || env.TS_MODE == 'authkey'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "${RUNNER_TEMP}/deploy_key"
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${RUNNER_TEMP}/deploy_key"
          tar -C deploy -czf "${RUNNER_TEMP}/clippy-cd.tgz" \
            deploy.sh cd-apply.sh ssh-forced-command.sh cutover-production.sh \
            compose known_hosts
          ssh -i "${RUNNER_TEMP}/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${GITHUB_WORKSPACE}/deploy/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "/data/deployments/clippy/bin/cd-apply.sh production '${IMAGE}'" \
            < "${RUNNER_TEMP}/clippy-cd.tgz"
      - name: Host-agent deploy handoff
        if: env.TS_MODE == 'host_agent'
        env:
          SHA: ${{ needs.ci-gate.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CTX="cd-host/clippy/production"
          gh api -X POST "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state=pending \
            -f context="$CTX" \
            -f description="deploy:${SHA}"
          echo "Waiting for ai-server cd-host-agent ($CTX)…"
          for i in $(seq 1 90); do
            STATE="$(gh api "repos/${{ github.repository }}/commits/${SHA}/statuses" \
              | jq -r --arg c "$CTX" '[.[]|select(.context==$c)][0].state // empty')"
            echo "poll $i state=${STATE:-none}"
            case "${STATE}" in
              success) exit 0 ;;
              failure|error) exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for host agent"
          exit 1

