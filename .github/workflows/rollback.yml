# Manual image-level rollback (not git revert).
# Syncs deploy artifacts from the workflow ref, then deploys the requested SHA image.
name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options:
          - staging
          - production
        required: true
      image_sha:
        description: "40-char commit SHA tag already present in GHCR"
        required: true
        type: string

concurrency:
  group: clippy-deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

env:
  IMAGE_NAME: ghcr.io/quintendesaever/clippy
  DEPLOY_HOST: ai-server
  # INTERIM: quinten + forced-command CD key (see docs/deployment.md). Prefer deploy-clippy later.
  DEPLOY_USER: quinten

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate SHA
        id: meta
        run: |
          SHA="$(echo -n "${{ inputs.image_sha }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "image_sha must be 40 hex chars"; exit 1; }
          echo "image=${IMAGE_NAME}:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Select deploy transport
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${TS_OAUTH_CLIENT_ID}" && -n "${TS_OAUTH_SECRET}" ]]; then
            MODE=oauth
          elif [[ -n "${TAILSCALE_AUTHKEY}" ]]; then
            MODE=authkey
          else
            MODE=host_agent
            echo "No Tailscale secrets; using cd-host-agent handoff on ai-server"
          fi
          echo "TS_MODE=${MODE}" >> "$GITHUB_ENV"
          if [[ "$MODE" == "oauth" || "$MODE" == "authkey" ]]; then
            [[ -n "${DEPLOY_SSH_KEY}" ]] || { echo "Missing secret DEPLOY_SSH_KEY (required for Tailscale SSH deploy)"; exit 1; }
          fi
      - name: Connect Tailscale (OAuth)
        if: env.TS_MODE == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Connect Tailscale (auth key)
        if: env.TS_MODE == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Sync deploy artifacts + rollback deploy
        if: env.TS_MODE == 'oauth' || env.TS_MODE == 'authkey'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_SSH_KEY}" || { echo "DEPLOY_SSH_KEY secret missing"; exit 1; }
          install -m 600 /dev/null "${RUNNER_TEMP}/deploy_key"
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${RUNNER_TEMP}/deploy_key"
          tar -C deploy -czf "${RUNNER_TEMP}/clippy-cd.tgz" \
            deploy.sh cd-apply.sh ssh-forced-command.sh cutover-production.sh \
            compose known_hosts
          ssh -i "${RUNNER_TEMP}/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${GITHUB_WORKSPACE}/deploy/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "/data/deployments/clippy/bin/cd-apply.sh '${{ inputs.environment }}' '${IMAGE}'" \
            < "${RUNNER_TEMP}/clippy-cd.tgz"
      - name: Host-agent rollback handoff
        if: env.TS_MODE == 'host_agent'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(echo -n "${IMAGE##*:}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          CTX="cd-host/clippy/${{ inputs.environment }}"
          gh api -X POST "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state=pending \
            -f context="$CTX" \
            -f description="deploy:${SHA}"
          for i in $(seq 1 90); do
            STATE="$(gh api "repos/${{ github.repository }}/commits/${SHA}/statuses" \
              | jq -r --arg c "$CTX" '[.[]|select(.context==$c)][0].state // empty')"
            echo "poll $i state=${STATE:-none}"
            case "${STATE}" in
              success) exit 0 ;;
              failure|error) exit 1 ;;
            esac
            sleep 10
          done
          exit 1

