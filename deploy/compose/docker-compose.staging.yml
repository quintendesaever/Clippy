# Staging: private only. No Cloudflare tunnel. No host LAN publish.
# Optional Tailscale bind for operator curl from the tailnet.
# Usage (via deploy.sh): CLIPPY_IMAGE=… docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d

name: clippy-staging

services:
  clippy:
    ports:
      # Tailscale IP only — discovered live host 100.66.108.109
      - "100.66.108.109:3100:3000"
    environment:
      # Staging dashboard URL must match staging secrets / OAuth redirect.
      DASHBOARD_PORT: "3000"
