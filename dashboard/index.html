<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Clippy Dashboard</title>
    <script>
      (function () {
        try {
          var appearance = localStorage.getItem("clippy.appearance");
          var allowed = ["modern", "classic", "light"];
          if (allowed.indexOf(appearance) < 0) {
            var legacyMode = localStorage.getItem("clippy.theme");
            var legacyPalette = localStorage.getItem("clippy.themePalette");
            if (allowed.indexOf(legacyMode) >= 0) appearance = legacyMode;
            else if (legacyMode === "light") appearance = "light";
            else if (legacyPalette === "classic") appearance = "classic";
            else appearance = "modern";
          }
          var theme = appearance === "light" ? "light" : "dark";
          var palette = appearance === "classic" ? "classic" : "modern";
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.palette = palette;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
